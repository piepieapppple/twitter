<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d4aff">
<title>RT 랜덤 추첨기</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211d2b;background:#f7f5fc}
*{box-sizing:border-box}body{margin:0;padding:22px 14px 40px}.wrap{max-width:680px;margin:auto}
header{margin:8px 0 20px}h1{font-size:28px;margin:0 0 8px;letter-spacing:-.04em}p{line-height:1.55;color:#655f72;margin:6px 0}
.card{background:white;border:1px solid #e7e1f2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #32205c0a}
label{display:block;font-weight:650;margin:14px 0 7px}input,select{font:inherit;width:100%;border:1px solid #d9d2e6;border-radius:11px;padding:13px;background:white;color:#211d2b}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer}
.primary{background:#6d4aff;color:white;width:100%;margin-top:14px}.secondary{background:#f0ebff;color:#4c2acb}.muted{font-size:13px;color:#797286}
.status{margin-top:12px;padding:12px;border-radius:10px;background:#f7f5fc;white-space:pre-wrap;overflow-wrap:anywhere}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.stat{background:#f6f2ff;padding:10px 12px;border-radius:10px;font-size:14px}
.winners{padding-left:24px;line-height:1.9;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #eee8f5;padding:9px 5px;font-size:14px}
.hidden{display:none!important}.warning{color:#8c4b00}.smallbtn{padding:8px 10px}
</style>
</head>
<body><main class="wrap">
<header><h1>RT 랜덤 추첨기</h1><p>X 게시물 링크로 리포스트 계정을 불러오고, 무작위로 당첨자를 뽑아요.</p></header>
<section class="card">
<label for="url">X 게시물 링크</label>
<input id="url" type="url" value="" placeholder="https://x.com/계정/status/게시물ID">
<label for="count">당첨 인원</label>
<select id="count"><option>1</option><option>3</option><option>5</option><option selected>10</option><option>20</option><option>30</option></select>
<button class="primary" id="fetch">RT 참여자 불러오기</button>
<div id="status" class="status" role="status">시작하려면 게시물 링크를 입력하세요.</div>
<div id="progress" class="muted"></div>
</section>
<section class="card hidden" id="listCard">
<h2>참여자 목록</h2><div class="stats"><div class="stat" id="total">0명</div><div class="stat" id="unique">중복 제거 후 0명</div></div>
<p class="muted">불러온 계정만 추첨 대상입니다. 결과를 발표하기 전에 원 게시물에서 조건 충족 여부를 확인하세요.</p>
<div class="actions"><button class="secondary" id="draw">당첨자 추첨</button><button class="secondary" id="csv">참여자 CSV 저장</button></div>
<div style="max-height:280px;overflow:auto;margin-top:12px"><table><thead><tr><th>#</th><th>아이디</th><th>이름</th></tr></thead><tbody id="users"></tbody></table></div>
</section>
<section class="card hidden" id="winnerCard">
<h2>당첨자</h2><p id="winnerSummary"></p><ol class="winners" id="winners"></ol>
<div class="actions"><button class="secondary" id="winnerCsv">당첨자 CSV 저장</button><button class="secondary" id="copy">당첨자 아이디 복사</button></div>
</section>
<footer class="muted">API 연결이 필요합니다. 목록은 현재 브라우저에서 처리하며, 추첨 결과를 자동으로 게시하지 않습니다.</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let allUsers=[], winners=[];
function setStatus(msg){$("status").textContent=msg}
function username(u){return u.username||u.userName||u.screen_name||u.handle||""}
function displayName(u){return u.name||u.display_name||""}
function downloadCSV(name, rows){
 const csv=rows.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)
}
$("fetch").onclick=async()=>{
 const url=$("url").value.trim();
 if(!/^https?:\/\/(www\.)?(x\.com|twitter\.com)\//i.test(url)){setStatus("X 게시물 링크를 확인해 주세요.");return}
 $("fetch").disabled=true;$("listCard").classList.add("hidden");$("winnerCard").classList.add("hidden");allUsers=[];
 try{
  setStatus("참여자 목록을 가져오는 중입니다. 잠시 기다려 주세요.");
  const r=await fetch("/api/reposters?url="+encodeURIComponent(url));
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"목록을 가져오지 못했습니다.");
  allUsers=Array.isArray(data.users)?data.users:[];
  if(!allUsers.length)throw new Error("조회된 계정이 없습니다. 게시물 공개 상태와 API 접근 권한을 확인해 주세요.");
  const seen=new Set();allUsers=allUsers.filter(u=>{const id=String(u.id||username(u)).toLowerCase();if(!id||seen.has(id))return false;seen.add(id);return true});
  $("total").textContent=allUsers.length+"명";$("unique").textContent="중복 제거 후 "+allUsers.length+"명";
  $("users").innerHTML=allUsers.map((u,i)=>`<tr><td>${i+1}</td><td>@${escapeHTML(username(u)||String(u.id||""))}</td><td>${escapeHTML(displayName(u))}</td></tr>`).join("");
  $("listCard").classList.remove("hidden");setStatus("완료! "+allUsers.length+"명의 계정을 불러왔습니다.");
 }catch(e){setStatus("오류: "+e.message+"\n잠시 후 다시 시도하거나 API 설정을 확인해 주세요.")}
 finally{$("fetch").disabled=false}
};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("draw").onclick=()=>{
 if(!allUsers.length)return;
 const n=Math.min(Number($("count").value)||10,allUsers.length);
 const pool=[...allUsers];winners=[];
 for(let i=0;i<n;i++){const j=Math.floor(Math.random()*pool.length);winners.push(pool.splice(j,1)[0])}
 $("winnerSummary").textContent=`전체 ${allUsers.length}명 중 ${winners.length}명 추첨`;
 $("winners").innerHTML=winners.map(u=>`<li>@${escapeHTML(username(u)||String(u.id||""))}${displayName(u)?" — "+escapeHTML(displayName(u)):""}</li>`).join("");
 $("winnerCard").classList.remove("hidden");
};
$("csv").onclick=()=>downloadCSV("rt_participants.csv",[["username","name","id"],...allUsers.map(u=>[username(u),displayName(u),u.id||""])]);
$("winnerCsv").onclick=()=>downloadCSV("rt_winners.csv",[["username","name","id"],...winners.map(u=>[username(u),displayName(u),u.id||""])]);
$("copy").onclick=async()=>{const text=winners.map(u=>"@"+username(u)).join("\n");try{await navigator.clipboard.writeText(text);$("winnerSummary").textContent="당첨자 아이디를 복사했어요."}catch{$("winnerSummary").textContent=text}};
</script>
</body></html>
